
services:
  nova-salud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-salud-pro
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      NOVA_HOST: 0.0.0.0
      PORT: 3000

      NOVA_ADMIN_PASSWORD: ${NOVA_ADMIN_PASSWORD:?Define NOVA_ADMIN_PASSWORD en .env}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NOVA_AI_MODEL: ${NOVA_AI_MODEL:-gpt-4o-mini}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      NOVA_STORAGE: mysql
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-nova_salud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nova_salud}

    depends_on:
      mysql-db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql-db:
    image: mysql:8.0
    container_name: nova-salud-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nova_salud}
      MYSQL_USER: ${MYSQL_USER:-nova_salud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}

    volumes:
      - nova_mysql_data:/var/lib/mysql
      - ./backups/nova_salud_backup.sql:/docker-entrypoint-initdb.d/001-nova-salud-backup.sql:ro

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  nova_mysql_data:
    name: botica_nova_salud_mysql_data